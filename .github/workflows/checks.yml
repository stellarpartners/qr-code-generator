name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inline script parses, ids are unique, images have alt text
        run: python3 tools/check-html.py

      - name: CDN integrity hashes match what unpkg serves
        run: python3 tools/check-integrity.py --verify
