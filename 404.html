<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — QR Code Generator</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --accent:#2563eb; --text:#1a1d23; --muted:#6b7280; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:16px; text-align:center; padding:32px;
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif; color:var(--text);
      background:#f5f6f8;
    }
    h1 { font-size:22px; letter-spacing:-.3px; }
    p { font-size:14px; color:var(--muted); max-width:32em; }
    a { display:inline-block; margin-top:8px; padding:10px 20px; border-radius:8px;
        background:var(--accent); color:#fff; font-size:14px; font-weight:600;
        text-decoration:none; }
    a:hover { background:#1d4ed8; }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p>That address does not exist on this site. The QR code generator is one page — you may have followed a stale link.</p>
  <a href="/">Go to the QR code generator</a>
</body>
</html>
